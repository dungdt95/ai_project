org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Tắt biên dịch incremental của Kotlin.
#
# Flutter đặt build dir của mọi plugin vào cùng thư mục `build/` của app. Khi
# nhiều module Kotlin biên dịch song song, Kotlin Build Tools API đăng ký trùng
# cùng một tệp cache và ném "Storage for [...] is already registered" rồi
# "Could not close incremental caches", làm build thất bại ở image_picker,
# share_plus, file_picker và shared_preferences.
#
# Dự án chỉ có code Dart, không có code Kotlin riêng, nên incremental không mang
# lại lợi ích gì — các module plugin chỉ biên dịch một lần rồi được cache.
kotlin.incremental=false

# Kotlin 2.4 đã bỏ chiến lược 'out-of-process'; 'daemon' là mặc định và là lựa
# chọn còn lại duy nhất ngoài 'in-process'.
kotlin.compiler.execution.strategy=daemon

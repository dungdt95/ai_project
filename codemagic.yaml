# Codemagic CI: build bản iOS của Kids English trên Mac cloud và đẩy lên TestFlight.
# Hướng dẫn thiết lập: kids_english_app/docs/HUONG_DAN_BUILD_IOS.md
workflows:
  kids-english-ios-testflight:
    name: Kids English iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: kids_english_app/app
    # Tên khoá API App Store Connect đã thêm trong Codemagic (Team settings → Integrations → Developer Portal).
    integrations:
      app_store_connect: kids_english_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bevui.kidsenglish
    # Chỉ chạy khi bấm "Start new build" (không tự build mỗi lần push).
    scripts:
      - name: Lấy thư viện
        script: flutter pub get
      - name: Chạy test
        script: flutter test
      - name: Cài hồ sơ ký ứng dụng
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

name: quanlynhatro
description: "App quản lý nhà trọ - Local SQLite, Vietnamese rental management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Format
  intl: ^0.18.1

  # Excel
  excel: ^4.0.2

  # Backup (zip)
  archive: ^3.6.1

  # Share
  share_plus: ^9.0.0
  file_picker: ^8.0.0+1

  # URL launcher (call/zalo)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

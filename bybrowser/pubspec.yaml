name: bybrowser
description: "Đọc, hiển thị và chỉnh sửa file văn bản, Excel (.xlsx), Word (.docx) — offline trên Android."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  archive: ^4.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.1
  package_info_plus: ^10.2.1
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  shared_preferences: ^2.5.5
  two_dimensional_scrollables: ^0.5.4
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
